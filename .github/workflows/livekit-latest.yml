name: LiveKit latest

# The native SDKs declare the LiveKit version they were tested with and let an
# app move to a newer 2.x. This builds and tests against the newest release
# every week, so a LiveKit change that breaks the SDKs shows up here before it
# shows up in an app.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # No Package.resolved is checked in, so this resolves the newest LiveKit 2.x.
      - name: Resolve the newest LiveKit
        run: swift package update && swift package show-dependencies | grep -i livekit

      - name: Test
        run: swift test

      - name: Build for the iOS simulator
        run: xcodebuild build -scheme FishAgent -destination 'generic/platform=iOS Simulator' -quiet

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Find the newest LiveKit 2.x
        id: livekit
        run: |
          version=$(curl -fsSL https://repo1.maven.org/maven2/io/livekit/livekit-android/maven-metadata.xml \
            | grep -o '<version>2\.[0-9]*\.[0-9]*</version>' | sed 's/<[^>]*>//g' | sort -V | tail -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Newest livekit-android: $version"

      - name: Test and build with it
        run: ./gradlew :agent:testDebugUnitTest :agent:assembleRelease -PlivekitVersion=${{ steps.livekit.outputs.version }}
