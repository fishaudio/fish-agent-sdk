name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from the "packageManager" field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Check publish manifests
        run: pnpm check:publish

      - name: Check native SDK versions
        run: pnpm check:native-version

      - name: Test
        run: pnpm test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The host build above compiles for macOS; this compiles the iOS-only code.
      - name: Build for the iOS simulator
        run: xcodebuild build -scheme FishAgent -destination 'generic/platform=iOS Simulator' -quiet

      - name: Build the example app
        working-directory: examples/ios
        run: xcodebuild build -project FishAgentExample.xcodeproj -scheme FishAgentExample -configuration Release -destination 'generic/platform=iOS Simulator' -quiet

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew :agent:testDebugUnitTest

      - name: Lint
        run: ./gradlew :agent:lintDebug

      - name: Build the release library
        run: ./gradlew :agent:assembleRelease
